<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Watchtower: dashboard (Apps)</title>
<link rel="stylesheet" href="shared.css"><script src="shared.js"></script>
<style>
.list { width: 620px; flex: none; border-right: 1px solid var(--sep); display: flex; flex-direction: column; }
.strip { display: flex; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--sep); align-items: center; }
.seg { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; border: .5px solid var(--border); font-size: 12.5px; color: var(--label2); }
.seg b { font-weight: 600; color: var(--label); font-variant-numeric: tabular-nums; }
.seg.on { background: var(--accent-soft); border-color: transparent; color: var(--label); }
.seg svg.sf { width: 14px; height: 14px; }
.th, .tr { display: grid; grid-template-columns: 206px 82px 82px 82px 1fr; align-items: center; padding: 0 16px; }
.th { height: 26px; font-size: 11.5px; color: var(--label2); border-bottom: 1px solid var(--sep); font-weight: 500; }
.tr { height: 36px; border-bottom: .5px solid var(--sep); }
.tr:nth-child(even) { background: var(--bg-row-alt); }
.tr.sel { background: var(--bg-select); }
.tr .nm { display: flex; align-items: center; gap: 9px; font-weight: 500; min-width: 0; }
.ico { width: 22px; height: 22px; border-radius: 5.5px; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; font-weight: 700; flex: none; }
.tr .v { font-variant-numeric: tabular-nums; color: var(--label2); }
.tr .v.new { color: var(--label); }
.detail { flex: 1; padding: 22px 24px; overflow: hidden; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.dh { display: flex; gap: 14px; align-items: flex-start; }
.dh .ico { width: 52px; height: 52px; border-radius: 12px; font-size: 22px; }
.dh h1 { font-size: 20px; margin: 0; font-weight: 700; line-height: 1.2; }
.dh .meta { margin-top: 2px; font-size: 12.5px; color: var(--label2); }
.dh > div:nth-child(2) { min-width: 0; flex: 1; }
.dh .act { margin-left: auto; flex: none; }
.h { font-size: 11px; font-weight: 600; text-transform: none; color: var(--label2); margin: 0 0 6px; }
.kv { display: grid; grid-template-columns: 96px 1fr; row-gap: 6px; font-size: 12.5px; }
.kv > :nth-child(odd) { color: var(--label2); }
.find { padding: 11px 12px; display: grid; gap: 7px; }
.find .top { display: flex; align-items: center; gap: 8px; }
.sel-note { font-size: 11.5px; color: var(--label2); }
.empty { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--label2); }
</style></head>
<body><div class="stage"><div class="window" id="w">
  <div class="sidebar" id="sb"></div>
  <div class="main">
    <div class="toolbar"><span class="title" id="ttl">Apps</span><span id="rb"></span><span id="rl"></span>
      <span class="search"><i data-i="magnifyingglass"></i>Search <span class="kbd" style="margin-left:auto">⌘F</span></span></div>
    <div style="display:flex;flex:1;min-height:0">
      <div class="list">
        <div class="strip" id="strip"></div>
        <div class="th"><span>Name</span><span>Installed</span><span>Latest</span><span>Source</span><span>Status ▾</span></div>
        <div id="rows" style="overflow:hidden"></div>
      </div>
      <div class="detail" id="detail"></div>
    </div>
  </div>
</div></div>
<script>
const state = q.get('state') || 'complete';
document.getElementById('sb').innerHTML = sidebarHTML('Apps');
document.getElementById('rb').innerHTML = refreshButton(state);
document.getElementById('rl').innerHTML = refreshLabel(state);
const C = { Q: '#6b5ce7', C: '#e8710a', S: '#2f9e6f', D: '#1f7ae0', V: '#2b6fd6', F: '#c2410c', X: '#2563eb', P: '#0e0e10', N: '#3b3b40', R: '#e5484d', G: '#7c3aed', B: '#0f766e', M: '#475569' };
const rows = [ // name, letter, installed, latest, source, status
  ['Quillnote', 'Q', '2.4.1', '2.5.0', 'Direct', 'Vulnerable'],
  ['Google Chrome', 'C', '129.0.6668', '130.0.6723', 'Direct', 'Update available'],
  ['Docker Desktop', 'D', '4.34.2', '4.35.1', 'Homebrew', 'Update available'],
  ['Visual Studio Code', 'V', '1.94.2', '1.95.0', 'Homebrew', 'Update available'],
  ['Slack', 'S', '4.40.128', '4.41.97', 'Direct', 'Update available'],
  ['Figma', 'F', '124.5.5', '124.7.4', 'Direct', 'Update available'],
  ['Obsidian', 'O', '1.7.4', '—', 'Direct', 'Error'],
  ['Xcode', 'X', '16.0', '—', 'App Store', 'Manual update'],
  ['Postgres', 'P', '15.7', '15.7', 'Homebrew', 'Pinned'],
  ['Mystery Tool', 'M', '0.9', '—', 'Manual', 'Unknown'],
  ['1Password', '1', '8.10.46', '8.10.46', 'Direct', 'Up to date'],
  ['Notion', 'N', '4.2.0', '4.2.0', 'Direct', 'Up to date'],
  ['Raycast', 'R', '1.84.0', '1.84.0', 'Homebrew', 'Up to date'],
  ['Things', 'T', '3.20', '3.20', 'App Store', 'Up to date'],
];
const col = { 'Quillnote': C.Q, 'Google Chrome': C.C, 'Docker Desktop': C.D, 'Visual Studio Code': C.V, 'Slack': C.G, 'Figma': C.F, 'Obsidian': C.G, 'Xcode': C.X, 'Postgres': C.X, 'Mystery Tool': C.M, '1Password': C.X, 'Notion': C.N, 'Raycast': C.R, 'Things': C.B };
const never = state === 'never';
const rowsHTML = never ? '' : rows.map(([n, l, a, b, s, st], i) =>
  `<div class="tr ${i === 0 ? 'sel' : ''}"><span class="nm"><span class="ico" style="background:${col[n]}">${l}</span>${n}</span><span class="v">${a}</span><span class="v ${st === 'Update available' || st === 'Vulnerable' ? 'new' : ''}">${b}</span><span class="v">${s}</span><span>${badge(st)}</span></div>`).join('');
document.getElementById('rows').innerHTML = rowsHTML;
document.getElementById('strip').innerHTML = never ? '<span class="sec">No scan data yet.</span>' :
  `<span class="seg on"><b>14</b> All</span><span class="seg">${sf('exclamationmark.shield')}<b>1</b> Vulnerable</span><span class="seg">${sf('arrow.up.circle')}<b>5</b> Update available</span><span class="seg">${sf('exclamationmark.triangle')}<b>1</b> Error</span>`;
const dEl = document.getElementById('detail');
dEl.innerHTML = never ? `<div class="empty" style="display:flex;margin-top:120px"><div style="font-size:30px;color:var(--label3)">${sf('arrow.clockwise').replace('class="sf','style="width:44px;height:44px" class="sf')}</div><div class="b" style="font-size:15px;color:var(--label)">No scan data</div><div>Click Refresh to scan your Mac.</div></div>` : `
  <div class="dh"><span class="ico" style="background:${C.Q}">Q</span>
    <div><h1>Quillnote</h1><div class="meta">Direct download<br><span class="mono" style="font-size:11.5px">/Applications/Quillnote.app</span></div>
      <div style="display:flex;gap:6px;margin-top:9px">${badge('Vulnerable')}${badge('Known exploited')}</div></div>
    <div class="act"><span class="btn prom lg">Update</span></div></div>
  <div><div class="h">Versions</div><div class="kv"><span>Installed</span><span class="num">2.4.1</span><span>Latest</span><span class="num">2.5.0 <span class="chip" style="margin-left:6px">minor update</span></span><span>Source</span><span>Direct download (Sparkle feed)</span><span>Last checked</span><span>Oct 29, 08:02</span></div></div>
  <div><div class="h">Findings (1)</div><div class="card find">
    <div class="top"><span class="mono b">SEC-0003</span><span class="b">Path traversal in the import filter</span></div>
    <div style="display:flex;gap:6px;align-items:center">${badge('High')}${badge('Open')}<span class="sec" style="margin-left:6px">Fixed in 2.5.0</span></div>
    <div class="sec" style="font-size:12px">Advisory matches quillnote@2.4.1. Listed in CISA KEV on Oct 24. Due date Nov 14.</div></div></div>
  <div><div class="h">Evidence</div><div class="kv"><span>Installed</span><span>Read from <span class="mono">Info.plist</span> (CFBundleShortVersionString)</span><span>Latest</span><span>Sparkle feed, retrieved Oct 29, 08:02</span><span>Advisory</span><span>GitHub Advisories, retrieved Oct 29, 08:01</span></div></div>`;
</script></body></html>
