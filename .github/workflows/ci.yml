name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci-gate:
    runs-on: macos-15
    # A hung test fails the job fast instead of blocking every merge (#52).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: ./scripts/build.sh
      - name: Test
        timeout-minutes: 12
        run: ./scripts/test.sh
