name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci-gate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: ./scripts/build.sh
      - name: Test
        run: ./scripts/test.sh
